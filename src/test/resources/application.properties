# Configuración exclusiva de pruebas: base de datos H2 en memoria, esquema
# generado por Hibernate. Sombrea a src/main/resources/application.properties
# (los recursos de test tienen prioridad en el classpath), así que el perfil
# `dev` y su datasource remoto NO se cargan durante las pruebas.

spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:sdo_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=15000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN
