spring.application.name=sistema-de-operaciones
server.port=8080
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_sistema_operaciones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
app.crypto.secret-key=${APP_CRYPTO_SECRET_KEY}
app.frontend.activation-url=http://localhost:5173/activar-cuenta
app.frontend.email-verification-url=http://localhost:5173/verificar-correo
app.frontend.password-reset-url=http://localhost:5173/restablecer-password
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.frontend.local-origin=http://127.0.0.1:5174
