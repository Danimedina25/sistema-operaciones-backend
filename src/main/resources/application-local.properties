spring.application.name=sistema-de-operaciones
server.port=8080
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_sistema_operaciones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
app.crypto.secret-key=${APP_CRYPTO_SECRET_KEY}
app.frontend.activation-url=${FRONTEND_ACTIVATION_URL:http://127.0.0.1:5174/activar-cuenta}
app.frontend.email-verification-url=${FRONTEND_EMAIL_VERIFICATION_URL:http://127.0.0.1:5174/verificar-correo}
app.frontend.password-reset-url=${FRONTEND_PASSWORD_RESET_URL:http://127.0.0.1:5174/restablecer-password}
app.mail.from=${MAIL_FROM:notificaciones@mail.se-estatus.com}
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend.local-origin=http://127.0.0.1:5174
